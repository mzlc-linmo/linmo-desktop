name: Build Linmo Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 git tag 自动获取）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (arm64 + amd64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install gon
        run: brew install mitchellh/gon/gon

      - name: Free up disk space
        run: |
          df -h /
          echo "清理 Xcode 模拟器运行时与缓存..."
          sudo rm -rf /Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Caches/org.swift.swiftpm" 2>/dev/null || true
          brew cleanup --prune=all 2>/dev/null || true
          df -h /

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning

      - name: Build + sign + notarize DMG
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            export VERSION="${{ github.event.inputs.version }}"
          fi
          make wails-dmg-all-signed

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linmo-macos-dmg
          path: dist-mac/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows installer (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build UI + embed
        shell: bash
        run: |
          cd ui && npm install && npm run build
          cd ..
          bash ./scripts/set-version.sh
          cp src/config-schema.json src/embed/ 2>/dev/null || true
          cp src/linmo.json.example src/embed/ 2>/dev/null || true
          cp src/.env src/embed/ 2>/dev/null || true

      - name: Build Windows installer
        shell: bash
        run: |
          NSIS_BIN=""
          for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS" "/c/Program Files (x86)/NSIS/Bin" "/c/ProgramData/chocolatey/bin"; do
            if [ -f "$d/makensis.exe" ]; then NSIS_BIN="$d"; break; fi
          done
          echo "NSIS 目录: ${NSIS_BIN:-未找到，回退到 PATH 中的 makensis}"
          if [ -n "$NSIS_BIN" ]; then export PATH="$NSIS_BIN:$PATH"; fi
          cd src
          wails build -platform windows/amd64 -nsis -skipbindings
          echo "产物列表:"
          ls -la build/bin/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Linmo-windows-installer
          path: src/build/bin/*-installer.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: Linmo-macos-dmg
          path: dist-mac

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Linmo-windows-installer
          path: dist-win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-mac/*.dmg
            dist-win/*.exe
          generate_release_notes: true
